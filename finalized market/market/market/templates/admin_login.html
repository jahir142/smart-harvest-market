<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link rel="icon" href="{{ url_for('static', filename='images/cake-img/logo.jpg') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #00c9a5, #00afa5, #007a70);
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  background: #fff;
  border-radius: 20px;
  padding: 40px 36px;
  width: 90%;
  max-width: 420px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  animation: popIn .4s ease;
}
@keyframes popIn {
  from { transform: scale(.9); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}

.logo-row {
  text-align: center;
  margin-bottom: 28px;
}
.shield-icon {
  width: 70px; height: 70px;
  background: linear-gradient(135deg, #00c9a5, #00afa5);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
}
.shield-icon i { font-size: 2.8rem; color: #fff; }

h2 { font-size: 2.2rem; color: #2f4858; margin-bottom: 4px; }
.sub { font-size: 1.3rem; color: #888; margin-bottom: 28px; }

.form-group {
  margin-bottom: 18px;
  position: relative;
}
.form-group label {
  display: block;
  font-size: 1.3rem;
  color: #555;
  margin-bottom: 6px;
  font-weight: 600;
}
.input-wrap {
  position: relative;
}
.input-wrap i {
  position: absolute;
  left: 14px; top: 50%;
  transform: translateY(-50%);
  color: #aaa;
  font-size: 1.5rem;
}
.input-wrap input {
  width: 100%;
  padding: 12px 14px 12px 42px;
  border: 1.5px solid #ddd;
  border-radius: 10px;
  font-size: 1.5rem;
  transition: border 0.2s;
  outline: none;
}
.input-wrap input:focus {
  border-color: #00c9a5;
  box-shadow: 0 0 0 3px rgba(0,201,165,0.15);
}

.error-box {
  background: #fff0f0;
  border: 1px solid #ffcccc;
  color: #cc0000;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 1.3rem;
  margin-bottom: 18px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.login-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #00c9a5, #00afa5);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 1.6rem;
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
  margin-top: 6px;
}
.login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0,175,165,0.4);
}

.back-link {
  display: block;
  text-align: center;
  margin-top: 20px;
  font-size: 1.3rem;
  color: #888;
  text-decoration: none;
}
.back-link:hover { color: #00c9a5; }

.hint-box {
  background: #f0fdfb;
  border: 1px solid #c0ede6;
  border-radius: 10px;
  padding: 12px 16px;
  font-size: 1.2rem;
  color: #555;
  margin-top: 20px;
  line-height: 1.8;
}
.hint-box b { color: #00c9a5; }
</style>
</head>
<body>

<div class="card">
  <div class="logo-row">
    <div class="shield-icon"><i class="fa fa-shield-halved"></i></div>
    <h2>Admin Login</h2>
    <p class="sub">Market Management Panel</p>
  </div>

  {% if error %}
  <div class="error-box">
    <i class="fa fa-circle-exclamation"></i> {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="/admin/login">
    <div class="form-group">
      <label>Admin Email</label>
      <div class="input-wrap">
        <i class="fa fa-envelope"></i>
        <input type="email" name="email" placeholder="admin@market.com"
               value="{{ request.form.get('email', '') }}" required autofocus>
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fa fa-lock"></i>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
    </div>
    <button type="submit" class="login-btn">
      <i class="fa fa-right-to-bracket"></i> Login to Dashboard
    </button>
  </form>

  <a href="/" class="back-link">
    <i class="fa fa-arrow-left"></i> Back to Site
  </a>

  <div class="hint-box">
    <b>Default credentials:</b><br>
    Email: <b>admin@market.com</b><br>
    Password: <b>admin123</b>
  </div>
</div>

</body>
</html>
